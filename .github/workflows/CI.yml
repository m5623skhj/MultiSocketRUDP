name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  classify_changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' || steps.filter.outputs.protocol == 'true' }}
      bot_tester: ${{ steps.filter.outputs.bot_tester == 'true' || steps.filter.outputs.protocol == 'true' }}
      protocol: ${{ steps.filter.outputs.protocol }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'MultiSocketRUDP/**'
              - 'CoreTest/**'
              - 'external/CommonCode/**'
              - '.gitmodules'
              - '.github/workflows/GoogleTest.yml'
              - '.github/workflows/CI.yml'
            bot_tester:
              - 'MultiSocketRUDPBotTester/**'
              - 'MultiSocketRUDP/CoreTest/ProtocolInteropV2Vector.json'
              - '.github/workflows/BotTester.yml'
              - '.github/workflows/CI.yml'
            workflows:
              - '.github/workflows/**'
            protocol:
              - 'MultiSocketRUDP/Tool/PacketDefine.yml'
              - 'MultiSocketRUDP/Tool/PacketGenerate*.bat'
              - 'MultiSocketRUDP/Tool/PacketGenerator/**'
              - 'MultiSocketRUDP/ContentsServer/**'
              - 'MultiSocketRUDP/ContentsClient/Protocol.*'
              - 'MultiSocketRUDP/ContentsClient/PacketIdType.h'
              - 'MultiSocketRUDP/Common/**'
              - 'MultiSocketRUDP/MultiSocketRUDPServer/**'
              - 'MultiSocketRUDP/MultiSocketRUDPClient/**'
              - 'MultiSocketRUDP/CoreTest/ProtocolInteropV2Vector.json'
              - 'MultiSocketRUDP/CoreTest/GeneratedPacketPayloadTest.cpp'
              - 'MultiSocketRUDP/CoreTest/GeneratedPacketSchemaPayloadTest.cpp'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester/Generated/**'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester/CommonType.cs'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester/Buffer/**'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester/ClientCore/**'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester/Contents/Client/**'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester/Bot/PacketSchema.cs'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester/Bot/PacketFieldCodec.cs'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester/Bot/SimpleActionNode.cs'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester.UnitTests/GeneratedPacketPayloadTests.g.cs'
              - 'MultiSocketRUDPBotTester/MultiSocketRUDPBotTester.UnitTests/GeneratedPacketSchemaPayloadTests.g.cs'
              - 'MultiSocketRUDPBotTester/ProtocolInteropTest/**'
              - 'external/CommonCode/**'
              - '.gitmodules'
              - '.github/workflows/CI.yml'

  protocol_sync:
    name: Protocol generated code sync
    needs: classify_changes
    if: needs.classify_changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install -r MultiSocketRUDP/Tool/PacketGenerator/requirements.txt
      - name: Test generator and check committed outputs
        run: |
          python -m unittest discover -s MultiSocketRUDP/Tool/PacketGenerator -p 'test_*.py'
          python -m unittest discover -s MultiSocketRUDP/Tool/PacketGenerator/tests -p 'test_*.py'
          python MultiSocketRUDP/Tool/PacketGenerator/PacketGenerator.py --check

  workflow_lint:
    name: Workflow actionlint
    needs: classify_changes
    if: needs.classify_changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" actionlint

      - name: Lint GitHub Actions workflows
        shell: bash
        run: ./actionlint

  native_gtest:
    name: Native GTest
    needs: classify_changes
    if: needs.classify_changes.outputs.server == 'true'
    uses: ./.github/workflows/GoogleTest.yml
    secrets: inherit

  bot_tester:
    name: BotTester Protocol Interop
    needs: classify_changes
    if: needs.classify_changes.outputs.bot_tester == 'true'
    uses: ./.github/workflows/BotTester.yml

  build-and-test:
    # Keep this check name stable because branch protection requires it.
    name: build-and-test
    if: always()
    needs: [classify_changes, workflow_lint, native_gtest, bot_tester, protocol_sync]
    runs-on: ubuntu-latest

    steps:
      - name: Verify required CI results
        env:
          CLASSIFIER_RESULT: ${{ needs.classify_changes.result }}
          SERVER_CHANGED: ${{ needs.classify_changes.outputs.server }}
          BOT_TESTER_CHANGED: ${{ needs.classify_changes.outputs.bot_tester }}
          WORKFLOWS_CHANGED: ${{ needs.classify_changes.outputs.workflows }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow_lint.result }}
          NATIVE_RESULT: ${{ needs.native_gtest.result }}
          BOT_TESTER_RESULT: ${{ needs.bot_tester.result }}
          PROTOCOL_CHANGED: ${{ needs.classify_changes.outputs.protocol }}
          PROTOCOL_RESULT: ${{ needs.protocol_sync.result }}
        run: |
          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            echo "Change classification failed: $CLASSIFIER_RESULT"
            exit 1
          fi

          if [ "$PROTOCOL_CHANGED" = "true" ] && [ "$PROTOCOL_RESULT" != "success" ]; then
            echo "Protocol generated code check was required but did not succeed: $PROTOCOL_RESULT"
            exit 1
          fi
          if [ "$PROTOCOL_CHANGED" != "true" ] && [ "$PROTOCOL_RESULT" != "skipped" ]; then
            echo "Unexpected protocol check result: $PROTOCOL_RESULT"
            exit 1
          fi

          if [ "$SERVER_CHANGED" = "true" ] && [ "$NATIVE_RESULT" != "success" ]; then
            echo "Native GTest was required but did not succeed: $NATIVE_RESULT"
            exit 1
          fi

          if [ "$BOT_TESTER_CHANGED" = "true" ] && [ "$BOT_TESTER_RESULT" != "success" ]; then
            echo "BotTester test was required but did not succeed: $BOT_TESTER_RESULT"
            exit 1
          fi

          if [ "$WORKFLOWS_CHANGED" = "true" ] && [ "$WORKFLOW_LINT_RESULT" != "success" ]; then
            echo "Workflow actionlint was required but did not succeed: $WORKFLOW_LINT_RESULT"
            exit 1
          fi

          if [ "$SERVER_CHANGED" != "true" ] && [ "$NATIVE_RESULT" != "skipped" ]; then
            echo "Native GTest was not required but returned: $NATIVE_RESULT"
            exit 1
          fi

          if [ "$BOT_TESTER_CHANGED" != "true" ] && [ "$BOT_TESTER_RESULT" != "skipped" ]; then
            echo "BotTester test was not required but returned: $BOT_TESTER_RESULT"
            exit 1
          fi

          if [ "$WORKFLOWS_CHANGED" != "true" ] && [ "$WORKFLOW_LINT_RESULT" != "skipped" ]; then
            echo "Workflow actionlint was not required but returned: $WORKFLOW_LINT_RESULT"
            exit 1
          fi

          echo "All applicable CI workflows succeeded."
